<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Rounded dark background -->
  <rect width="100" height="100" rx="22" fill="#060913" />
  
  <!-- Padlock loop (glowing neon cyan) -->
  <path d="M32 44 V32 A18 18 0 0 1 68 32 V44" fill="none" stroke="#00F0FF" stroke-width="7" stroke-linecap="round" filter="url(#glow-cyan)" />
  <path d="M32 44 V32 A18 18 0 0 1 68 32 V44" fill="none" stroke="#00F0FF" stroke-width="7" stroke-linecap="round" />
  
  <!-- Padlock body (glowing cyber dark grey with green border) -->
  <rect x="18" y="42" width="64" height="46" rx="12" fill="#0D1527" stroke="#00FF66" stroke-width="4.5" filter="url(#glow-green)" />
  <rect x="18" y="42" width="64" height="46" rx="12" fill="#0D1527" stroke="#00FF66" stroke-width="4.5" />
  
  <!-- Stylized E2EE letter 'X' in the center -->
  <path d="M36 52 L64 78 M64 52 L36 78" stroke="#00F0FF" stroke-width="7.5" stroke-linecap="round" />
  <circle cx="50" cy="65" r="4.5" fill="#00FF66" />

  <!-- Neon Glowing Filters -->
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
</svg>